'use strict';const $=id=>document.getElementById(id),audio=$('audio'),radio=$('radio');let stations=[],selected=null,favorites=[],onlyFavorites=false;const APIS=['https://de1.api.radio-browser.info/json','https://nl1.api.radio-browser.info/json','https://at1.api.radio-browser.info/json'];const VERIFIED=[{stationuuid:'verified-rfm80s-portugal',name:'RFM 80s',country:'Portugal',tags:'80s,rfm,portugal',url:'https://27913.live.streamtheworld.com/GR80SRFM.mp3',url_resolved:'https://27913.live.streamtheworld.com/GR80SRFM.mp3'}];try{favorites=JSON.parse(localStorage.getItem('retro-radio-favorites')||'[]')}catch{}const key=s=>s.stationuuid||s.url_resolved||s.url,isFav=s=>!!s&&favorites.some(f=>key(f)===key(s)),setStatus=s=>$('status').textContent=s;function save(){try{localStorage.setItem('retro-radio-favorites',JSON.stringify(favorites))}catch{}}function render(){const list=onlyFavorites?favorites:stations;$('results').replaceChildren();list.slice(0,12).forEach(s=>{const b=document.createElement('button'),n=document.createElement('span'),c=document.createElement('span');n.textContent=s.name||'Station';c.textContent=s.country||'';b.append(n,c);b.onclick=()=>choose(s,true);$('results').append(b)});if(!list.length){const p=document.createElement('div');p.textContent=onlyFavorites?'Aucun favori':'Lancez une recherche';$('results').append(p)}}function choose(s,auto){selected=s;$('station').textContent=s.name||'Station';$('meta').textContent=s.country||'Internet Radio';setStatus('Station sélectionnée');render();if(auto)play()}async function play(){if(!selected)return setStatus('Choisissez une station.');const u=selected.url_resolved||selected.url;if(audio.src!==u){audio.src=u;audio.load()}setStatus('Connexion au direct…');try{await audio.play()}catch{setStatus('Lecture impossible sur ce navigateur.')}}function move(d){const l=onlyFavorites?favorites:stations;if(!l.length)return;let i=l.findIndex(s=>selected&&key(s)===key(selected));choose(l[(i+d+l.length)%l.length],true)}async function api(path){for(const a of APIS){try{const r=await fetch(a+path);if(r.ok)return await r.json()}catch{}}throw Error()}async function search(){const q=$('search').value.trim();onlyFavorites=false;setStatus('Recherche…');try{let all=[];if(!q)all=await api('/stations/topclick/50');else{const req=['/stations/search?'+new URLSearchParams({name:q,limit:'60',hidebroken:'true',order:'clickcount',reverse:'true'}),'/stations/search?'+new URLSearchParams({tag:q,limit:'60',hidebroken:'true'})];const rs=await Promise.allSettled(req.map(api));rs.forEach(r=>r.status==='fulfilled'&&all.push(...r.value))}const nq=q.toLowerCase();const v=!q?VERIFIED:VERIFIED.filter(s=>(s.name+' '+s.country+' '+s.tags).toLowerCase().includes(nq)||nq.includes('rfm 80'));const seen=new Set();stations=[...v,...all].filter(s=>s.url_resolved||s.url).filter(s=>{const k=key(s);if(seen.has(k))return false;seen.add(k);return true});render();setStatus(stations.length?stations.length+' stations trouvées.':'Aucun résultat.')}catch{setStatus('Recherche indisponible.')}}$('searchBtn').onclick=search;$('search').addEventListener('keydown',e=>{if(e.key==='Enter')search()});$('favFilter').onclick=()=>{onlyFavorites=!onlyFavorites;render();setStatus(onlyFavorites?'Favoris':'Résultats')};$('fav').onclick=()=>{if(!selected)return;favorites=isFav(selected)?favorites.filter(s=>key(s)!==key(selected)):[...favorites,selected];save();render()};$('play').onclick=play;$('pause').onclick=()=>{audio.pause();setStatus('En pause.')};$('stop').onclick=()=>{audio.pause();audio.removeAttribute('src');audio.load();setStatus('Lecture arrêtée.')};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('volume').oninput=e=>audio.volume=Number(e.target.value)/100;audio.volume=.7;$('mute').onclick=()=>audio.muted=!audio.muted;audio.onplaying=()=>{radio.classList.add('playing');setStatus('● EN DIRECT')};audio.onpause=()=>radio.classList.remove('playing');audio.onerror=()=>setStatus('Flux inaccessible.');render();
</script></body></html>
