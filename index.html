*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:28px 8px;background:radial-gradient(circle at 50% 15%,#625752,#2b2522 45%,#151211);font-family:Arial;color:#eee}.deck{position:relative;width:min(100%,520px);padding:72px 18px 24px;border:7px solid #72050b;border-radius:27px 27px 38px 38px;background:linear-gradient(100deg,#ff4650,#df1824 12%,#c70d18 58%,#9d0710);box-shadow:inset 5px 0 8px #ff747a,inset -7px 0 10px #620007,0 28px 65px #0009}.handle{position:absolute;left:7%;right:7%;top:-28px;height:52px;border:13px solid #151515;border-bottom:0;border-radius:17px 17px 0 0;background:#222;box-shadow:inset 0 2px #666}.brandbar{position:absolute;left:18px;right:18px;top:16px;height:43px;background:linear-gradient(#222,#070707);border:2px solid #333;border-radius:5px;display:flex;align-items:center;justify-content:space-between;padding:0 13px}.brand{font-size:clamp(17px,5vw,24px);font-weight:900;font-style:italic}.model{font-size:8px;letter-spacing:1.5px;color:#aaa;text-align:right}.screen-shell{background:#080808;border:5px solid #292929;border-radius:8px;padding:7px}.screen{background:linear-gradient(135deg,#06280d,#0a4415 55%,#05220b);color:#70ff82;border:2px solid #020202;border-radius:4px;padding:13px;min-height:225px;box-shadow:inset 0 0 30px #001e06,0 0 8px #20ff4540;font-family:"Courier New",monospace}.head{display:flex;justify-content:space-between;font-size:10px;font-weight:bold;letter-spacing:1px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#42ff59;box-shadow:0 0 8px #42ff59}.station{font-size:clamp(23px,7vw,34px);font-weight:900;line-height:1.05;margin:14px 0 4px;overflow-wrap:anywhere}.status{font-size:12px;min-height:30px;color:#bdffc5}.search{width:100%;padding:9px;background:#c6ffcd;border:2px solid #126a24;border-radius:3px;color:#052b0c;font:bold 12px "Courier New"}.screen-controls{display:flex;gap:7px;margin-top:7px}.screen button{font:700 10px "Courier New";background:#073d1 -size:clamp(8px,2.5vw,11px);font-weight:bold;cursor:pointer}.keys span{display:block;font-size:21px;margin-bottom:12px}.keys button:active{transform:translateY(4px);border-bottom-width:4px}.controls{display:flex;align-items:center;gap:9px;margin-top:12px;padding:10px 12px;background:linear-gradient(#242424,#0b0b0b);border:2px solid #3a3a3a;border-radius:5px;font-size:10px;letter-spacing:1px}.controls input{flex:1;min-width:0;accent-color:#df1722}.controls button{background:#161616;border:1px solid #555;color:#fff;padding:7px}.mark{text-align:center;margin-top:9px;font-size:8px;letter-spacing:2px;color:#f7b9bc}.note{text-align:center;font-size:10px;opacity:.65}@media(max-width:390px){.deck{padding-left:10px;padding-right:10px}.brandbar{left:10px;right:10px}.window{height:145px}.cassette{height:112px}.reel{width:47px;height:47px}.keys{gap:3px}.keys button{height:70px}}

</style></head><body><main><section class="deck" id="deck"><div class="handle"></div><div class="brandbar"><div class="brand">SnakeBonD's Radio</div><div class="model">INTERNET<br>STEREO RECEIVER</div></div><div class="screen-shell"><div class="screen"><div class="head"><span><i class="dot"></i> INTERNET RADIO</span><span>STEREO • LIVE</span></div><div class="station" id="station">Choisir une radio</div><div class="status" id="status" role="status">Recherchez une station pour commencer.</div><input class="search" id="search" aria-label="Rechercher une station" type="search" placeholder="STATION • PAYS • GENRE"><div class="screen-controls"><button id="searchBtn">SEARCH</button><button id="favFilter">★ FAVORITES</button></div><div class="results" id="results"></div></div></div><div class="stereo"><span>FM • WEB • DIGITAL</span><span><i class="led"></i><i class="led"></i><i class="led"></i></span></div><div class="bay"><div class="window"><div class="cassette"><div class="label">SnakeBonD • RADIO</div><div class="reels"><div class="reel"></div><div class="tape"></div><div class="reel"></div></div></div></div></div><div class="reverse">◁ AUTO REVERSE ▷</div><div class="keys"><button id="fav"><span>●</span>FAV</button><button id="play"><span>▷</span>PLAY</button><button id="prev"><span>◁◁</span>PREV</button><button id="next"><span>▷▷</span>NEXT</button><button id="stop"><span>□</span>STOP</button><button id="pause"><span>Ⅱ</span>PAUSE</button></div><div class="controls"><label for="volume">VOLUME</label><input id="volume" type="range" min="0" max="100" value="70"><button id="mute" aria-label="Activer ou désactiver le son">🔊</button></div><div class="mark">DIGITAL TUNING SYSTEM • Wi-Fi INTERNET RADIO</div></section><p class="note">Les flux dépendent des stations. Une connexion Internet est nécessaire.</p></main><audio id="audio" preload="none"></audio><script>
'use strict';const $=id=>document.getElementById(id),audio=$('audio'),deck=$('deck');let stations=[],selected=null,favorites=[],onlyFavorites=false;const APIS=['https://de1.api.radio-browser.info/json','https://nl1.api.radio-browser.info/json','https://at1.api.radio-browser.info/json'];const VERIFIED=[{stationuuid:'verified-rfm80s-portugal',name:'RFM 80s',country:'Portugal',countrycode:'PT',language:'Portuguese',tags:'80s,années 80,rfm,portugal,lisboa',url:'https://27913.live.streamtheworld.com/GR80SRFM.mp3',url_resolved:'https://27913.live.streamtheworld.com/GR80SRFM.mp3'}];try{favorites=JSON.parse(localStorage.getItem('retro-radio-favorites')||'[]')}catch{}const key=s=>s.stationuuid||s.url_resolved||s.url,isFav=s=>!!s&&favorites.some(f=>key(f)===key(s)),status=s=>$('status').textContent=s,save=()=>localStorage.setItem('retro-radio-favorites',JSON.stringify(favorites));function render(){const list=onlyFavorites?favorites:stations;$('results').replaceChildren();if(!list.length){const p=document.createElement('p');p.textContent=onlyFavorites?'Aucun favori enregistré.':'Aucune station. Lancez une recherche.';$('results').append(p)}list.forEach(s=>{const b=document.createElement('button'),n=document.createElement('span'),c=document.createElement('small');n.textContent=s.name||'Station';c.textContent=s.country||'';b.append(n,c);b.onclick=()=>choose(s,true);$('results').append(b)});$('fav').style.color=isFav(selected)?'#ff3344':'white'}function choose(s,a){selected=s;$('station').textContent=s.name||'Station';status('Station sélectionnée');render();if(a)play()}async function play(){if(!selected)return status('Choisissez une station.');const u=selected.url_resolved||selected.url;if(audio.src!==u){audio.src=u;audio.load()}status('Connexion au direct…');try{await audio.play()}catch{status('Lecture impossible. Essayez une autre station.')}}function move(d){const l=onlyFavorites?favorites:stations;if(!l.length)return;let i=l.findIndex(s=>selected&&key(s)===key(selected));choose(l[(i+d+l.length)%l.length],true)}const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,'').trim();async function api(path){for(const a of APIS){try{const r=await fetch(a+path);if(r.ok)return await r.json()}catch{}}throw Error()}async function search(){const q=$('search').value.trim(),nq=norm(q);onlyFavorites=false;status('Recherche en cours…');$('searchBtn').disabled=true;try{let all=[];if(!q)all=await api('/stations/topclick/80');else{const req=['/stations/search?'+new URLSearchParams({name:q,limit:'80',hidebroken:'true',order:'clickcount',reverse:'true'}),'/stations/search?'+new URLSearchParams({tag:q,limit:'80',hidebroken:'true'})];const b=await Promise.allSettled(req.map(api));b.forEach(x=>x.status==='fulfilled'&&all.push(...x.value))}const v=!q?VERIFIED:VERIFIED.filter(s=>norm([s.name,s.country,s.tags].join(' ')).includes(nq)||nq.includes('rfm 80')||['rfm','80','80s'].includes(nq));const seen=new Set();stations=[...v,...all].filter(s=>s.url_resolved||s.url).filter(s=>{let k=key(s);if(seen.has(k))return false;seen.add(k);return true});render();status(stations.length?stations.length+' stations trouvées. Choisissez une radio.':'Aucun résultat.')}catch{status('Recherche indisponible.')}finally{$('searchBtn').disabled=false}}$('searchBtn').onclick=search;$('search').onkeydown=e=>e.key==='Enter'&&search();$('favFilter').onclick=()=>{onlyFavorites=!onlyFavorites;render();status(onlyFavorites?'Vos stations favorites.':'Toutes les stations trouvées.')};$('fav').onclick=()=>{if(!selected)return;favorites=isFav(selected)?favorites.filter(s=>key(s)!==key(selected)):[...favorites,selected];save();render()};$('play').onclick=play;$('pause').onclick=()=>{audio.pause();status('En pause.')};$('stop').onclick=()=>{audio.pause();audio.removeAttribute('src');audio.load();status('Lecture arrêtée.')};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('volume').oninput=e=>audio.volume=e.target.value/100;audio.volume=.7;$('mute').onclick=()=>{audio.muted=!audio.muted;$('mute').textContent=audio.muted?'🔇':'🔊'};audio.onplaying=()=>{deck.classList.add('playing');status('● EN DIRECT')};audio.onpause=()=>deck.classList.remove('playing');audio.onerror=()=>status('Flux inaccessible.');render();
</script></body></html>
