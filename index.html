<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ed1723"><meta name="description" content="Radio Internet au style magnétophone rétro"><link rel="manifest" href="manifest.webmanifest"><title>Retro Radio</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#eee;background:#352c29}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px 10px}.deck{width:min(100%,480px);border:8px solid #a70b12;border-radius:42px;background:linear-gradient(100deg,#ff3440,#ed0d1c 25%,#ed0d1c 78%,#aa0812);padding:26px 20px 28px;box-shadow:inset 5px 0 7px #ff7a7d,inset -5px 0 9px #780008,0 25px 55px #160f0f}.handle{height:23px;background:linear-gradient(#555,#0a0a0a);border-radius:12px;margin:-23px 30px 14px}.screen{background:#00ed39;color:#073a0e;border:9px solid #191919;border-radius:13px;padding:16px;min-height:245px;box-shadow:inset 0 0 25px #00a521;font-family:'Courier New',monospace}.screen small{font-weight:bold;letter-spacing:2px}.station{font-size:clamp(23px,7vw,35px);font-weight:900;overflow-wrap:anywhere;margin:20px 0 5px}.status{font-size:13px;min-height:35px}.screen-controls{display:flex;gap:8px;margin-top:10px}.screen button,.screen input{font:inherit}.screen button{background:#083f18;color:#afffc2;border:0;padding:9px;border-radius:5px;cursor:pointer}.search{width:100%;padding:11px;background:#c9ffd4;border:2px solid #075018;border-radius:6px;color:#073a0e}.results{max-height:130px;overflow:auto;margin-top:8px}.results button{width:100%;text-align:left;margin:3px 0;display:flex;justify-content:space-between;gap:8px}.results small{letter-spacing:0;font-size:10px}.label{text-align:center;font-size:25px;font-weight:bold;letter-spacing:3px;margin:12px 0 6px}.cassette{background:linear-gradient(#191919,#080808);border:6px solid #2b2b2b;border-radius:10px;padding:18px 12px 14px;box-shadow:inset 0 0 15px #000}.cassette-top{display:flex;justify-content:space-between;align-items:center}.reel{width:75px;height:75px;border:9px dashed #ddd;border-radius:50%;background:radial-gradient(circle,#111 0 22%,#444 24% 40%,#050505 42%);border-color:#888}.playing .reel{animation:spin 2s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.tape{height:43px;flex:1;margin:0 10px;background:linear-gradient(90deg,#38281f,#171717,#ddd,#171717,#38281f);border:5px solid #333;border-radius:5px}.stripe{height:25px;background:#f11c30;margin-top:14px}.reverse{text-align:center;background:#181818;padding:12px;font-size:16px;letter-spacing:2px}.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:13px}.keys button{min-width:0;height:88px;background:linear-gradient(120deg,#393939,#141414);border:2px solid #444;border-bottom:8px solid #080808;border-radius:5px;color:white;font-size:clamp(10px,2.7vw,14px);cursor:pointer}.keys button span{display:block;font-size:23px;margin-bottom:12px}.keys button:active{transform:translateY(3px);border-bottom-width:5px}.below{background:#1a1a1a;border-radius:9px;margin-top:12px;padding:12px;display:flex;align-items:center;gap:10px}.below input{flex:1;min-width:0;accent-color:#ef2335}.below button{background:#343434;border:1px solid #777;border-radius:6px;color:white;padding:9px;cursor:pointer}.note{text-align:center;font-size:11px;opacity:.7;margin:12px auto 0;max-width:440px}button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}@media(max-width:370px){.deck{padding:24px 11px}.reel{width:54px;height:54px}.keys button{height:75px}.keys button span{font-size:18px}}
</style></head><body><main><section class="deck" id="deck" aria-label="Lecteur radio rétro"><div class="handle"></div><div class="screen"><small>● INTERNET RADIO · LIVE</small><div class="station" id="station">Choisir une radio</div><div class="status" id="status" role="status">Recherchez une station pour commencer.</div><input class="search" id="search" type="search" placeholder="Rechercher une station, un pays ou un genre" aria-label="Rechercher des radios"><div class="screen-controls"><button id="searchBtn">RECHERCHER</button><button id="favFilter" aria-pressed="false">★ FAVORIS</button></div><div class="results" id="results" aria-label="Stations disponibles"></div></div><div class="label">STEREO</div><div class="cassette"><div class="cassette-top"><div class="reel"></div><div class="tape"></div><div class="reel"></div></div><div class="stripe"></div></div><div class="reverse">◁ AUTO REVERSE ▷</div><div class="keys"><button id="fav" title="Ajouter ou retirer des favoris"><span>●</span>FAV</button><button id="play"><span>▷</span>PLAY</button><button id="prev"><span>◁◁</span>PREV</button><button id="next"><span>▷▷</span>NEXT</button><button id="stop"><span>□</span>STOP</button><button id="pause"><span>Ⅱ</span>PAUSE</button></div><div class="below"><label for="volume">VOL</label><input id="volume" type="range" min="0" max="100" value="70"><button id="mute">🔊</button></div></section><p class="note">Les flux dépendent des stations. Une connexion Internet est nécessaire.</p></main><audio id="audio" preload="none"></audio><script>
'use strict';
const $=id=>document.getElementById(id),audio=$('audio'),deck=$('deck');
let stations=[],selected=null,index=-1,favorites=[],onlyFavorites=false;
const APIS=['https://de1.api.radio-browser.info/json','https://nl1.api.radio-browser.info/json','https://at1.api.radio-browser.info/json'];
try{favorites=JSON.parse(localStorage.getItem('retro-radio-favorites')||'[]')}catch{}
const setStatus=s=>$('status').textContent=s;
const save=()=>{try{localStorage.setItem('retro-radio-favorites',JSON.stringify(favorites))}catch{}};
const key=s=>s.stationuuid||s.url_resolved||s.url;
const isFav=s=>!!s&&favorites.some(f=>key(f)===key(s));
function render(){const list=onlyFavorites?favorites:stations;$('results').replaceChildren();if(!list.length){const p=document.createElement('p');p.textContent=onlyFavorites?'Aucun favori enregistré.':'Aucune station. Lancez une recherche.';$('results').append(p)}list.forEach(s=>{const b=document.createElement('button');const name=document.createElement('span');name.textContent=s.name||'Station sans nom';const country=document.createElement('small');country.textContent=s.country||'';b.append(name,country);b.onclick=()=>choose(s,true);$('results').append(b)});$('favFilter').setAttribute('aria-pressed',String(onlyFavorites));$('fav').style.color=isFav(selected)?'#ff3344':'white'}
function choose(s,autoplay){selected=s;index=stations.findIndex(x=>key(x)===key(s));$('station').textContent=s.name||'Station';setStatus('Station sélectionnée');render();if(autoplay)play()}
async function play(){if(!selected){setStatus('Choisissez une station dans la liste.');return}const url=selected.url_resolved||selected.url;if(!url||!/^https?:\/\//i.test(url)){setStatus('Flux indisponible.');return}if(audio.src!==url){audio.src=url;audio.load()}setStatus('Connexion au direct…');try{await audio.play()}catch{setStatus('Lecture impossible. Essayez une autre station ou autorisez la lecture.')}}
function move(delta){const list=onlyFavorites?favorites:stations;if(!list.length){setStatus('Aucune station disponible.');return}const i=list.findIndex(s=>selected&&key(s)===key(selected));choose(list[(i+delta+list.length)%list.length],true)}
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,'').trim();
async function apiFetch(path){let last;for(const api of APIS){try{const r=await fetch(api+path);if(r.ok)return await r.json();last=new Error('HTTP '+r.status)}catch(e){last=e}}throw last||new Error('Service indisponible')}
async function search(){
 const q=$('search').value.trim();onlyFavorites=false;$('favFilter').setAttribute('aria-pressed','false');setStatus('Recherche en cours…');$('searchBtn').disabled=true;
 try{
   let all=[];
   if(!q){all=await apiFetch('/stations/topclick/80')}
   else{
     const requests=[
       '/stations/search?'+new URLSearchParams({name:q,limit:'80',hidebroken:'true',order:'clickcount',reverse:'true'}),
       '/stations/search?'+new URLSearchParams({name:q,country:'Portugal',limit:'80',hidebroken:'true',order:'clickcount',reverse:'true'}),
       '/stations/search?'+new URLSearchParams({tag:q,limit:'80',hidebroken:'true',order:'clickcount',reverse:'true'})
     ];
     const batches=await Promise.allSettled(requests.map(apiFetch));
     batches.forEach(x=>{if(x.status==='fulfilled')all.push(...x.value)});
   }
   const seen=new Set();
   stations=all.filter(s=>s.url_resolved||s.url).filter(s=>{const k=key(s);if(seen.has(k))return false;seen.add(k);return true});
   const nq=norm(q);
   if(nq) stations.sort((a,b)=>{
     const an=norm(a.name),bn=norm(b.name),ac=norm(a.country),bc=norm(b.country);
     const score=x=>x===nq?100:x.startsWith(nq)?60:x.includes(nq)?30:0;
     return (score(bn)+(bc==='portugal'?5:0))-(score(an)+(ac==='portugal'?5:0));
   });
   render();setStatus(stations.length?`${stations.length} stations trouvées. Choisissez une radio.`:'Aucun résultat dans Radio Browser. Cette station peut ne pas être référencée dans son annuaire.');
 }catch{setStatus('Recherche indisponible. Vérifiez votre connexion puis réessayez.')}
 finally{$('searchBtn').disabled=false}
}
$('searchBtn').onclick=search;$('search').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
$('favFilter').onclick=()=>{onlyFavorites=!onlyFavorites;render();setStatus(onlyFavorites?'Vos stations favorites.':'Toutes les stations trouvées.')};
$('fav').onclick=()=>{if(!selected){setStatus('Sélectionnez une station avant de l’ajouter.');return}favorites=isFav(selected)?favorites.filter(s=>key(s)!==key(selected)):[...favorites,selected];save();render();setStatus(isFav(selected)?'Ajoutée aux favoris.':'Retirée des favoris.')};
$('play').onclick=play;$('pause').onclick=()=>{audio.pause();setStatus('En pause.')};$('stop').onclick=()=>{audio.pause();audio.removeAttribute('src');audio.load();setStatus('Lecture arrêtée.')};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);
$('volume').oninput=e=>audio.volume=Number(e.target.value)/100;audio.volume=.7;$('mute').onclick=()=>{audio.muted=!audio.muted;$('mute').textContent=audio.muted?'🔇':'🔊'};
audio.onplaying=()=>{deck.classList.add('playing');setStatus('● EN DIRECT')};audio.onpause=()=>deck.classList.remove('playing');audio.onerror=()=>{deck.classList.remove('playing');if(audio.getAttribute('src'))setStatus('Flux inaccessible ou format non pris en charge. Essayez une autre radio.')};audio.onwaiting=()=>setStatus('Mise en mémoire tampon…');
render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
